# The Relay — example service settings.
#
#   copy relay.example.toml relay.toml     (Windows)
#   cp relay.example.toml relay.toml       (macOS / Linux)
#   relay doctor
#   relay serve
#
# These defaults need NO API key: answers come from the stand-in model service, started
# inside the same process and calibrated from real Groq measurements (v1 evidence).
#
# Secrets never go in this file. GROQ_API_KEY and MAX_REAL_CALLS are read from the
# environment or .env. Any value here can be overridden with an environment variable
# RELAY_<SECTION>__<KEY>, for example RELAY_SERVER__PORT=9000 or RELAY_CACHE__MODE=off.

[server]
host = "127.0.0.1"
port = 8000

# Provider router (V2-09). Lanes are tried in order; the first is the primary. A lane is
# used when its guard can admit the request within max_wait_ms (or the next one is tried);
# if none can, the request waits for the lane that frees up first, up to its deadline.
# Every lane has its own ProviderGuard (RPM/TPM windows, daily budget, circuit breaker).
# The older top-level [[lanes]] spelling still works (not both).
[providers]
max_wait_ms = 2000

[[providers.lanes]]
name = "standin"
kind = "standin"                 # "standin" or "groq"
model = "qwen/qwen3.8-27b"
embedded = true                  # start the stand-in in-process on 127.0.0.1
profile = "evidence/standin_calibration/cal-20261113T022403Z-3f687c6/profile.json"
max_completion_tokens = 512
# USD per million tokens, for cost_usd. The stand-in is simulated, so no money is spent.
# A lane without pricing reports cost_usd = null (unknown); no price is ever guessed.
pricing = { input_per_m = 0.0, output_per_m = 0.0 }
# escalate_to = "stronger"       # retry a truncated or empty answer once on that lane
# is_reasoning_model = false
# guard = { rpm = 30 }           # this lane's own overrides of [guard] below

# To use real Groq instead, replace the lane above with this one. It needs GROQ_API_KEY in
# the environment or .env, and MAX_REAL_CALLS > 0 as a hard cap on real calls per process
# (shared by every Groq lane). Copy the rates from Groq's pricing page into `pricing`.
#
# [[providers.lanes]]
# name = "groq"
# kind = "groq"
# model = "qwen/qwen3.8-27b"
# max_completion_tokens = 512
# pricing = { input_per_m = <from Groq's price list>, output_per_m = <...> }

# ProviderGuard limits per lane. tpm and rpd default to the values Groq reported in v1, so
# removing them from this file does NOT disable them. TOML has no null: to switch a limit
# off (treat it as unknown), use the environment, e.g. RELAY_GUARD__RPD=null. rpm and tpd
# are unknown (not enforced) by default.
[guard]
max_concurrency = 2
tpm = 8000                       # v1 P02-LIVE: x-ratelimit-limit-tokens
rpd = 1000                       # v1 P02-LIVE: x-ratelimit-limit-requests
daily_safety_fraction = 0.75     # stop new calls at 75 % of the daily limit

# Admission queue. Capacity = floor(service rate x patience median), where service rate =
# TPM / (60 x tokens per answer). Set capacity to override the derived value.
[queue]
patience_median_s = 20.0
tokens_per_answer = 1513.0       # v1 P07: mean tokens per answer, real small_fast
# Fair admission (V2-10). Each tenant's bucket refills at this share of the service rate;
# a request over it is not refused, it waits behind other tenants' requests that are
# within their rate. "interactive" requests go before "batch", and batch is shed first.
tenant_rate_share = 0.5
tenant_burst = 4.0               # requests a tenant may send at once before it is over rate
adaptive_capacity = true         # capacity follows the measured tokens per answer (EWMA)
ewma_alpha = 0.2

# API keys (V2-10): `relay tenants create --name N`, then `relay keys create --tenant T`.
# Keys are stored as SHA-256 hashes and printed once. The development key "relay-dev-key"
# (the web UI's default) is accepted only while the server listens on loopback, unless set.
[auth]
# dev_key_enabled = false

# Relative paths resolve against the working directory: run from the repository root.
[paths]
papers_dir = "data/papers"
index_dir = "data/indexes"
models_dir = "data/models"
store_path = "data/relay.sqlite3" # used from V2-02
uploads_dir = "data/uploads"      # uploaded PDFs, named by SHA-256 (V2-03)
collections_dir = "data/collections" # per-collection indexes (V2-03)

[cache]
mode = "memory"                  # "off", "memory", or "sqlite" (store + collections, V2-03)

# Collections and ingestion (V2-03); active only with cache.mode = "sqlite".
# Shared state (V2-13). "memory" (the default) needs no Redis: one process. "redis" lets
# several workers share the answer cache, SingleFlight coalescing (ten identical questions
# across workers make one model call) and each lane's quota counters. Needs the extra:
#   pip install -e ".[redis]"
# Put a URL with a password in the environment instead: RELAY_STATE__REDIS_URL=...
[state]
backend = "memory"               # "memory" or "redis"
redis_url = "redis://localhost:6379/0"
# key_prefix = "relay"
# flight_lock_ttl_s = 30         # a dead leader's lock expires after this
# lease_poll_s = 1.0             # how often a silent follower checks its leader is alive
# cache_ttl_s = 604800           # cached answers expire after a week in Redis

[ingestion]
max_upload_mb = 50.0
max_pages = 500
poll_interval_s = 2.0            # how often the ingest worker looks for queued documents
max_attempts = 3                 # a failing document is tried at most this many times
max_loaded_collections = 8       # collection indexes kept in memory (least recently used out)

# L4: advisory entailment score on each verified sentence (V2-07). Download the model once
# with `python scripts/download_l4_model.py`; without its files, L4 is simply off.
[verifier]
l4_model_dir = "data/models/nli/nli-MiniLM2-L6-H768"
l4_model_file = "onnx/model_quint8_avx2.onnx"   # int8 for AVX2 CPUs; else "onnx/model.onnx"
l4_threads = 4                                   # ONNX threads per scoring call (at most 4)

# Follow-ups on POST /v1/ask (V2-08): a question in a conversation with earlier turns is
# rewritten into a standalone question before retrieval and the cache. First questions are
# never rewritten. "auto" = the model on a Groq lane, rules on a stand-in lane.
[rewriter]
mode = "auto"                 # auto | llm | rules
# model = "<a smaller model id>"   # default: the lane's model (none verified yet)
timeout_s = 1.5               # slower than this: the original question is used
max_completion_tokens = 64

[retrieval]
settings = ["small_fast", "balanced_rerank", "large_wide"]
