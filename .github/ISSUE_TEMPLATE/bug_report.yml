name: Bug report
description: Something doesn't work as documented
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. docker compose up --build
        2. Ask "..." in the v1-papers collection
        3. ...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Output or logs
      description: The output of `relay doctor` helps a lot. Remove any keys before pasting.
      render: text
  - type: input
    id: env
    attributes:
      label: Environment
      placeholder: "OS, Python version, Docker or local, stand-in or Groq"
