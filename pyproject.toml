[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "the-relay"
version = "0.1.0"
description = "Rate-limit-aware, citation-verified RAG Q&A over three pinned arXiv papers."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6,<3",
    "pydantic-settings>=2.2,<3",
    "httpx>=0.27",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pymupdf>=1.24",
    "fastembed>=0.3",
    "rank-bm25>=0.2.2",
    "numpy>=1.26",
    "aiosqlite>=0.20",
]

[project.scripts]
relay = "relay.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.5",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["error"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "."]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
