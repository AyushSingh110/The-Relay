[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "the-relay"
version = "2.0.0"
description = "RAG Q&A over your own PDFs: every streamed sentence is checked against the passage it cites, under a tight model quota."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Ayush Singh" }]
keywords = ["rag", "llm", "retrieval", "citations", "verification", "rate-limiting", "fastapi", "groq"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Framework :: FastAPI",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "pydantic>=2.6,<3",
    "pydantic-settings>=2.2,<3",
    "httpx>=0.27",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pymupdf>=1.24",
    "fastembed>=0.3",
    "rank-bm25>=0.2.2",
    "numpy>=1.26",
    "aiosqlite>=0.20",
    "python-multipart>=0.0.9",
    "prometheus-client>=0.20",  # V2-11: GET /metrics (approved dependency)
    "opentelemetry-sdk>=1.24",  # V2-11: request tracing (approved dependency)
]

[project.urls]
Homepage = "https://github.com/AyushSingh110/The-Relay"
Repository = "https://github.com/AyushSingh110/The-Relay"
Issues = "https://github.com/AyushSingh110/The-Relay/issues"
Changelog = "https://github.com/AyushSingh110/The-Relay/blob/main/CHANGELOG.md"

[project.scripts]
relay = "relay.cli:main"

[project.optional-dependencies]
# V2-13: [state] backend = "redis" (multi-worker); the default memory backend needs neither
redis = ["redis>=5"]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.5",
    "huggingface_hub>=0.20",  # scripts/download_l4_model.py (V2-07 L4 model)
    "redis>=5",               # V2-13: tests/test_multi_worker.py
    "fakeredis[lua]>=2.20",   # V2-13: an in-process Redis (Lua scripts included), offline
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["error"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "."]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
