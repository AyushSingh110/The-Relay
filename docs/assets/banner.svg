<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-labelledby="t d">
  <title id="t">The Relay</title>
  <desc id="d">Answers from your PDFs. Every sentence is checked against the passage it cites before you see it; a sentence that fails the check is held back.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1620"/>
      <stop offset="1" stop-color="#132a33"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.4" r="0.55">
      <stop offset="0" stop-color="#1fa18c" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#1fa18c" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="1280" height="400" rx="18" fill="url(#bg)"/>
  <rect width="1280" height="400" rx="18" fill="url(#grid)"/>
  <rect width="1280" height="400" rx="18" fill="url(#glow)"/>

  <g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
    <!-- the mark: a baton handed from one point to the next, the second one checked -->
    <g transform="translate(72 96)">
      <circle cx="10" cy="0" r="8" fill="#8a96a3"/>
      <rect x="18" y="-2" width="30" height="4" rx="2" fill="#4a5a68"/>
      <circle cx="64" cy="0" r="16" fill="#1fa18c"/>
      <path d="M56 0l6 6 11-12" fill="none" stroke="#0d1620" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <text x="70" y="192" fill="#f2f6f8" font-size="70" font-weight="760" letter-spacing="-1.5">The Relay</text>
    <text x="72" y="238" fill="#b9c6cf" font-size="23">Answers from your PDFs, where every sentence is</text>
    <text x="72" y="270" fill="#b9c6cf" font-size="23">checked against the passage it cites before you see it.</text>

    <!-- feature pills -->
    <g font-size="15" font-weight="600" text-anchor="middle">
      <rect x="72" y="306" width="172" height="36" rx="18" fill="#1fa18c" fill-opacity="0.16" stroke="#1fa18c" stroke-opacity="0.5"/>
      <text x="158" y="329" fill="#7fdcc9">Verified streaming</text>
      <rect x="256" y="306" width="158" height="36" rx="18" fill="#5b74e6" fill-opacity="0.16" stroke="#5b74e6" stroke-opacity="0.55"/>
      <text x="335" y="329" fill="#aab8ff">Rate-limit aware</text>
      <rect x="426" y="306" width="188" height="36" rx="18" fill="#d69a3a" fill-opacity="0.15" stroke="#d69a3a" stroke-opacity="0.55"/>
      <text x="520" y="329" fill="#f0c784">Cache + SingleFlight</text>
    </g>

    <!-- an answer card: two verified sentences, one held back, the source, the timing -->
    <g transform="translate(712 52)" filter="url(#shadow)">
      <rect width="500" height="296" rx="14" fill="#182430" stroke="#2b3b49"/>

      <text x="26" y="34" fill="#7d8b97" font-size="11.5" font-weight="700" letter-spacing="1.2">QUESTION</text>
      <text x="26" y="58" fill="#e9eff3" font-size="17" font-weight="700">How many attention heads does the base model use?</text>
      <line x1="26" y1="76" x2="474" y2="76" stroke="#2b3b49"/>

      <!-- verified sentence 1 -->
      <circle cx="35" cy="102" r="9" fill="#1fa18c"/>
      <path d="M30.5 102l3 3 5.5-6" fill="none" stroke="#0d1620" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="54" y="107" fill="#dfe7ec" font-size="15">The base model uses 8 parallel attention heads.</text>
      <rect x="430" y="92" width="38" height="20" rx="10" fill="#2a3a75"/>
      <text x="449" y="106" fill="#c4cdfa" font-size="12" font-weight="700" text-anchor="middle">P1</text>

      <!-- verified sentence 2 -->
      <circle cx="35" cy="136" r="9" fill="#1fa18c"/>
      <path d="M30.5 136l3 3 5.5-6" fill="none" stroke="#0d1620" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="54" y="141" fill="#dfe7ec" font-size="15">Each head works in 64 dimensions (512 / 8).</text>
      <rect x="430" y="126" width="38" height="20" rx="10" fill="#2a3a75"/>
      <text x="449" y="140" fill="#c4cdfa" font-size="12" font-weight="700" text-anchor="middle">P1</text>

      <!-- a sentence the verifier held back -->
      <circle cx="35" cy="170" r="8.5" fill="none" stroke="#6b7a87" stroke-width="2" stroke-dasharray="3 3"/>
      <rect x="54" y="164" width="196" height="11" rx="5.5" fill="#6b7a87" fill-opacity="0.32"/>
      <text x="262" y="174" fill="#8a96a3" font-size="12.5" font-style="italic">held back: not supported by P1</text>

      <!-- the source -->
      <rect x="26" y="194" width="448" height="30" rx="8" fill="#111c26" stroke="#2b3b49"/>
      <rect x="36" y="200" width="30" height="18" rx="9" fill="#2a3a75"/>
      <text x="51" y="213" fill="#c4cdfa" font-size="11" font-weight="700" text-anchor="middle">P1</text>
      <text x="76" y="214" fill="#9fb0bc" font-size="13">Attention Is All You Need · §3.2.2 Multi-Head Attention</text>

      <!-- the timing bar: queue, retrieval, model, verification -->
      <rect x="26" y="246" width="44" height="8" rx="4" fill="#8a96a3"/>
      <rect x="73" y="246" width="78" height="8" rx="2" fill="#5b74e6"/>
      <rect x="154" y="246" width="244" height="8" rx="2" fill="#1fa18c"/>
      <rect x="401" y="246" width="73" height="8" rx="4" fill="#d69a3a"/>
      <g font-size="11.5" fill="#8a96a3">
        <text x="26" y="274">queue</text>
        <text x="73" y="274">retrieval</text>
        <text x="154" y="274">model</text>
        <text x="401" y="274">verification</text>
      </g>
    </g>
  </g>
</svg>
